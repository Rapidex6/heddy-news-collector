name: Refresh news
on:
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the two validated JSON feeds to OVH'
        type: boolean
        default: false
      if_due:
        description: 'Collect only when a public language feed needs refreshing'
        type: boolean
        default: false
      verify_sftp:
        description: 'Verify OVH SFTP login and directory without changing files'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: news-refresh
  cancel-in-progress: false
jobs:
  freshness:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check both public refresh timestamps
        id: check
        if: github.event_name == 'schedule' || (inputs.if_due && !inputs.verify_sftp)
        run: python3 refresh_check.py due
  refresh:
    needs: freshness
    if: needs.freshness.outputs.due != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.18'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m unittest discover -v
      - name: Verify SFTP access without publication
        if: github.event_name == 'workflow_dispatch' && inputs.verify_sftp
        run: |
          python - <<'PY'
          import json, os, posixpath, stat
          from sftp_publish import connect
          client = connect()
          try:
              with client.open_sftp() as sftp:
                  root = sftp.normalize(os.environ['NEWS_SFTP_ROOT'])
                  if posixpath.basename(root) != 'www':
                      raise ValueError('Unexpected website directory')
                  sftp.stat(root)
                  print('Verified OVH SFTP login and www directory; no files changed.')
                  counts = {'files': 0, 'directories': 0, 'symlinks': 0, 'other': 0, 'bytes': 0}
                  pending = [root]
                  while pending:
                      directory = pending.pop()
                      for entry in sftp.listdir_attr(directory):
                          if entry.filename in {'.', '..'}:
                              continue
                          if stat.S_ISDIR(entry.st_mode):
                              counts['directories'] += 1
                              pending.append(posixpath.join(directory, entry.filename))
                          elif stat.S_ISREG(entry.st_mode):
                              counts['files'] += 1
                              counts['bytes'] += entry.st_size
                          elif stat.S_ISLNK(entry.st_mode):
                              counts['symlinks'] += 1
                          else:
                              counts['other'] += 1
                          if sum(counts[key] for key in ('files', 'directories', 'symlinks', 'other')) > 10000:
                              raise ValueError('Website inventory exceeds the diagnostic limit')
                  print('Website root inventory (names omitted): ' + json.dumps(counts))
          finally:
              client.close()
          PY
        env:
          NEWS_SFTP_HOST: ${{ vars.NEWS_SFTP_HOST }}
          NEWS_SFTP_PORT: ${{ vars.NEWS_SFTP_PORT }}
          NEWS_SFTP_USER: ${{ vars.NEWS_SFTP_USER }}
          NEWS_SFTP_ROOT: ${{ vars.NEWS_SFTP_ROOT }}
          NEWS_SFTP_HOST_FINGERPRINT: ${{ vars.NEWS_SFTP_HOST_FINGERPRINT }}
          NEWS_SFTP_PASSWORD: ${{ secrets.NEWS_SFTP_PASSWORD }}
      - name: Restore durable history
        run: python github_state.py pull
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Collect and validate both selections
        run: python collector.py
      - name: Save durable per-language history
        run: python github_state.py push
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish only the validated JSON feeds
        if: vars.NEWS_PUBLISH_ENABLED == 'true' && (github.event_name == 'schedule' || inputs.publish)
        run: python sftp_publish.py
        env:
          NEWS_SFTP_HOST: ${{ vars.NEWS_SFTP_HOST }}
          NEWS_SFTP_PORT: ${{ vars.NEWS_SFTP_PORT }}
          NEWS_SFTP_USER: ${{ vars.NEWS_SFTP_USER }}
          NEWS_SFTP_ROOT: ${{ vars.NEWS_SFTP_ROOT }}
          NEWS_SFTP_HOST_FINGERPRINT: ${{ vars.NEWS_SFTP_HOST_FINGERPRINT }}
          NEWS_SFTP_PASSWORD: ${{ secrets.NEWS_SFTP_PASSWORD }}
      - name: Verify both public feeds against the collected bytes
        if: vars.NEWS_PUBLISH_ENABLED == 'true' && (github.event_name == 'schedule' || inputs.publish)
        run: python refresh_check.py verify
